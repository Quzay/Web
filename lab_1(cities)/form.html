<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Запропонувати місто</title>
</head>
<body>
    <header>
        <h1>Запропонувати місто</h1>
        <nav>
            <a href="index.html">Головна</a> |
            <a href="city-lviv.html">Львів</a> |
            <a href="city-sheptytskyi.html">Червоноград</a> |
            <a href="city-prague.html">Прага</a> |
            <a href="form.html">Запропонувати місто</a>
        </nav>
    </header>
    <main>
        <form>
            <p>
                <label for="name">Ім'я:</label>
                <input type="text" id="name" name="name" required>
            </p>
            <p>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </p>
            <p>
                <label for="city">Місто:</label>
                <input type="text" id="city" name="city" required>
            </p>
            <p>
                <label for="country">Країна:</label>
                <select id="country" name="country">
                    <option>Україна</option>
                    <option>Чехія</option>
                    <option>Польща</option>
                    <option>Інша</option>
                </select>
            </p>
            <p>
                <label for="reason">Чому варто відвідати це місто?</label><br>
                <textarea id="reason" name="reason" rows="5" cols="40"></textarea>
            </p>
            <button type="submit">Надіслати</button>
        </form>
    </main>
    <footer>
        <p>Автор: Шишало Максим</p>
        <p>Група: КН-41</p>
    </footer>
</body>
</html>
